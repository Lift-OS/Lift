<!-- pages/clientes.html -->
<div id="tab-clientes">
  <!-- Stats -->
  <div class="stats-grid no-print">
    <div class="stat-card"><div class="stat-value" id="statTotalClientes">0</div><div class="stat-label">Total Clientes</div></div>
    <div class="stat-card"><div class="stat-value" id="statTotalMarcas">0</div><div class="stat-label">Total Marcas</div></div>
    <div class="stat-card"><div class="stat-value" id="statClientesComOS">0</div><div class="stat-label">Clientes c/ OS</div></div>
    <div class="stat-card"><div class="stat-value" id="statTotalOSClientes">0</div><div class="stat-label">Total OS</div></div>
    <div class="stat-card"><div class="stat-value" id="statOSAbertasCliente">0</div><div class="stat-label">OS em Aberto</div></div>
    <div class="stat-card"><div class="stat-value" id="statOSAprovadasCliente">0</div><div class="stat-label">OS Aprovadas</div></div>
  </div>

  <!-- Formulário de Cadastro -->
  <div class="checklist-card p-4 md:p-5 mb-5" id="clienteFormCard">
    <h2 class="font-display text-xl mb-3"><i class="fas fa-user-plus"></i> Cadastro de Cliente</h2>
    
    <div class="grid md:grid-cols-2 gap-3">
      <input type="text" id="cad_nome" placeholder="Nome*" class="form-input">
      <input type="text" id="cad_cnpj" placeholder="CNPJ/CPF" class="form-input">
      <input type="text" id="cad_endereco" placeholder="Endereço" class="form-input">
      <input type="text" id="cad_cidade" placeholder="Cidade" class="form-input">
      <input type="text" id="cad_telefone" placeholder="Telefone" class="form-input">
      <input type="text" id="cad_whatsapp" placeholder="WhatsApp" class="form-input">
      <input type="email" id="cad_email" placeholder="E-mail" class="form-input">
      <input type="text" id="cad_responsavel_nome" placeholder="Responsável (Nome)" class="form-input">
      <input type="text" id="cad_responsavel_telefone" placeholder="Telefone do Responsável" class="form-input">
    </div>
    
    <div class="mt-4">
      <label class="font-semibold text-sm">Equipamentos do Cliente</label>
      <div id="equipamentosList"></div>
      <button type="button" onclick="ClientesModule.adicionarCampoEquipamento()" class="btn btn-secondary text-sm mt-2">
        <i class="fas fa-plus"></i> Adicionar Equipamento
      </button>
    </div>
    
    <div class="flex gap-3 mt-5 flex-wrap">
      <button id="btnSalvarCliente" class="btn btn-primary"><i class="fas fa-save"></i> Salvar Cliente</button>
      <button id="cad_btnCancelar" class="btn btn-secondary" style="display:none">Cancelar</button>
      <button id="btnExportarCSVClientes" class="btn btn-secondary"><i class="fas fa-file-csv"></i> Exportar CSV</button>
      <button id="btnImportarCSVClientes" class="btn btn-secondary"><i class="fas fa-upload"></i> Importar CSV</button>
    </div>
  </div>

  <!-- Lista de Clientes -->
  <div class="mt-5">
    <input type="text" id="cad_searchInput" placeholder="Buscar cliente..." class="form-input w-full md:w-64 mb-3">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-[var(--bg-secondary)]">
          <tr><th class="p-2 md:p-3 text-left">Nome</th><th class="p-2 md:p-3 text-left">Cidade</th><th class="p-2 md:p-3 text-left">Marcas</th><th class="p-2 md:p-3 text-left">Ações</th></tr>
        </thead>
        <tbody id="cad_tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal de Equipamentos -->
<div id="equipModal" class="modal" style="display:none">
  <div class="modal-content bg-[var(--card)] rounded-2xl p-6 max-w-md w-full">
    <div class="modal-title text-lg font-bold mb-4"><i class="fas fa-forklift"></i> Selecione o Equipamento</div>
    <div id="equipList"></div>
    <button onclick="document.getElementById('equipModal').style.display='none'" class="btn btn-secondary w-full mt-3">Cancelar</button>
  </div>
</div>
