<!-- Substitua a linha do select "Unidade" por esta -->
<div>
  <label class="block text-xs text-[var(--muted)] mb-1">Unidade</label>
  <select id="est_unidade" class="form-input">
    <option value="un">Unidade</option>
    <option value="pc">Peça</option>
    <option value="mt">Metro</option>
    <option value="kg">Quilo</option>
    <option value="lt">Litro</option>
    <option value="conj">Conjunto</option>
    <option value="cx">Caixa</option>  <!-- ← NOVO -->
  </select>
</div>

<!-- Substitua a linha do Preço Custo e Preço Venda por estas -->
<div>
  <label class="block text-xs text-[var(--muted)] mb-1">Preço Custo (R$)</label>
  <input type="number" id="est_preco_custo" class="form-input" step="0.01" value="0" onchange="Estoque.calcularPrecoVenda()">
</div>
<div>
  <label class="block text-xs text-[var(--muted)] mb-1">Margem (%)</label>
  <input type="number" id="est_margem" class="form-input" step="0.5" value="30" onchange="Estoque.calcularPrecoVenda()">
</div>
<div>
  <label class="block text-xs text-[var(--muted)] mb-1">Preço Venda (R$)</label>
  <input type="number" id="est_preco_venda" class="form-input" step="0.01" value="0">
  <button type="button" onclick="Estoque.calcularPrecoVenda()" class="btn btn-secondary text-xs mt-1 w-full">Calcular</button>
</div>
