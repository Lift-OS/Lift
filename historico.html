<!-- pages/historico.html -->
<div id="tab-historico">
  <!-- Stats -->
  <div class="stats-grid no-print">
    <div class="stat-card"><div class="stat-value" id="statTotalOS">0</div><div class="stat-label">Total de OS</div></div>
    <div class="stat-card"><div class="stat-value text-[#60a5fa]" id="statStatusAbertura">0</div><div class="stat-label">Em Abertura</div></div>
    <div class="stat-card"><div class="stat-value text-[#fbbf24]" id="statStatusExecucao">0</div><div class="stat-label">Em Execução</div></div>
    <div class="stat-card"><div class="stat-value text-[#34d399]" id="statStatusFinalizacao">0</div><div class="stat-label">Finalizando</div></div>
    <div class="stat-card"><div class="stat-value text-[#a78bfa]" id="statStatusFechada">0</div><div class="stat-label">Fechadas</div></div>
    <div class="stat-card"><div class="stat-value text-[#4ade80]" id="statStatusAprovada">0</div><div class="stat-label">Aprovadas</div></div>
    <div class="stat-card"><div class="stat-value" id="statEsteMes">0</div><div class="stat-label">OS este Mês</div></div>
  </div>

  <!-- Lista de OS -->
  <div class="checklist-card p-4 md:p-5">
    <h2 class="font-display text-xl mb-3">Histórico de O.S</h2>
    
    <div class="flex flex-wrap gap-3 mb-4">
      <input type="text" id="historicoSearch" placeholder="Buscar..." class="form-input w-48">
      <select id="historicoFiltroTipo" class="form-input w-36">
        <option value="">Todos os Tipos</option>
        <option value="emergencial">Emergencial</option>
        <option value="preventiva">Preventiva</option>
        <option value="corretiva">Corretiva</option>
        <option value="garantia">Garantia</option>
        <option value="normal">Normal</option>
        <option value="avaliacao">Avaliação</option>
        <option value="orcamento">Orçamento</option>
      </select>
      <select id="historicoFiltroStatus" class="form-input w-32">
        <option value="">Todos Status</option>
        <option value="abertura">Abertura</option>
        <option value="execucao">Execução</option>
        <option value="finalizacao">Finalizando</option>
        <option value="fechada">Fechada</option>
        <option value="aprovada">Aprovada</option>
      </select>
      <button id="btnExportarCSVHistorico" class="btn btn-secondary text-sm"><i class="fas fa-file-csv"></i> Exportar</button>
      <button id="btnImportarCSVHistorico" class="btn btn-secondary text-sm"><i class="fas fa-upload"></i> Importar</button>
      <button id="btnLimparHistorico" class="btn btn-secondary text-sm text-red-400"><i class="fas fa-trash"></i> Limpar</button>
    </div>
    
    <div class="overflow-x-auto">
      <table class="table-os w-full">
        <thead class="bg-[var(--bg-secondary)]">
          <tr><th class="p-2 text-left">O.S</th><th class="p-2 text-left">Data</th><th class="p-2 text-left">Cliente</th><th class="p-2 text-left">Status</th><th class="p-2 text-right">Horas</th><th class="p-2 text-left">Ações</th></tr>
        </thead>
        <tbody id="historicoTableBody"></tbody>
      </table>
    </div>
    <div id="historicoEmpty" class="text-center py-8 text-[var(--muted)] hidden">Nenhuma O.S encontrada</div>
  </div>
</div>
