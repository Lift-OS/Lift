<!-- pages/agendamentos.html -->
<div id="tab-agendamentos">
  <!-- Formulário -->
  <div class="checklist-card p-4 md:p-5 mb-5">
    <h2 class="font-display text-xl mb-3"><i class="fas fa-calendar-alt"></i> Gerenciar Agendamentos</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-xs text-[var(--muted)] mb-1">Cliente</label>
        <input type="text" id="ag_cliente" class="form-input" list="clientesList" placeholder="Selecione ou digite">
        <datalist id="clientesList"></datalist>
      </div>
      <div>
        <label class="block text-xs text-[var(--muted)] mb-1">O.S para o Técnico</label>
        <select id="ag_os_select" class="form-input">
          <option value="">Selecione a OS</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-[var(--muted)] mb-1">Data</label>
        <input type="date" id="ag_data" class="form-input">
      </div>
      <div>
        <label class="block text-xs text-[var(--muted)] mb-1">Horário</label>
        <input type="time" id="ag_horario" class="form-input">
      </div>
      <div>
        <label class="block text-xs text-[var(--muted)] mb-1">Técnico</label>
        <select id="ag_tecnico" class="form-input">
          <option value="">Selecione</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-[var(--muted)] mb-1">Descrição</label>
        <textarea id="ag_descricao" class="form-input" rows="2" placeholder="Descrição resumida..."></textarea>
      </div>
    </div>
    
    <div class="flex gap-3 flex-wrap">
      <button id="ag_salvar" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
      <button id="ag_limpar" class="btn btn-secondary">Limpar</button>
      <input type="hidden" id="ag_editId" value="">
    </div>
  </div>

  <!-- Lista de Agendamentos -->
  <h3 class="font-display text-lg mb-3 px-1">Agendamentos Pendentes</h3>
  <div id="agendamentosLista"></div>
</div>
